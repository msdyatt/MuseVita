name: Source checks
on:
  push:
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install demo website dependencies
        run: python -m pip install -r web/requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q web tests
      - name: Test demo session logic
        run: python -m unittest discover -s tests -v

  vita-vpk:
    name: Build Vita VPK
    runs-on: ubuntu-latest
    # Keep CI on the same supported VitaSDK release series used for the
    # reproducible local build. The official full image includes libvita2d,
    # mbedTLS, curl, and the Vita packaging tools.
    container:
      image: vitasdk/vitasdk:2026.08
    steps:
      - uses: actions/checkout@v4
      - name: Configure Vita build
        run: cmake -S vita -B build-vita -DCMAKE_BUILD_TYPE=Release
      - name: Build VPK
        run: cmake --build build-vita -j2
      - name: Verify package contents
        run: |
          test -s build-vita/MuseVita.vpk
          unzip -l build-vita/MuseVita.vpk
          unzip -l build-vita/MuseVita.vpk | grep -F 'sce_sys/icon0.png'
          unzip -l build-vita/MuseVita.vpk | grep -F 'sce_sys/pairing.html'
          unzip -l build-vita/MuseVita.vpk | grep -F 'sce_sys/pairing-crypto.js'
