<!doctype html>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MuseVita setup</title>
<style>
body{font:16px system-ui,sans-serif;background:#0a0d18;color:#f7f8ff;margin:0;padding:24px}
main{max-width:560px;margin:auto;background:#181e31;border-radius:18px;padding:24px}
h1{font-size:28px;margin-top:0}p{color:#d3d9e8;line-height:1.45}
label{display:block;border:2px dashed #9d8bff;border-radius:12px;padding:22px;text-align:center;margin:18px 0}
input{display:none}button{background:#9d8bff;border:0;border-radius:10px;padding:13px 18px;font-weight:700;font-size:16px}
#status{margin-top:18px;color:#6fd6a0;white-space:pre-wrap}
</style>
<main>
<h1>Connect MuseVita</h1>
<p>This is a one-time local transfer. Choose the official <code>identity.json</code>, <code>pairing.json</code>, and <code>sdk_token</code> files from your pairing host. They are encrypted in this browser for this Vita and sent only over your local network.</p>
<label><input id="files" type="file" multiple>Choose pairing files</label>
<button id="send" disabled>Encrypt and send to Vita</button>
<div id="status">Waiting for files…</div>
</main>
<script>
const $=id=>document.getElementById(id), p=new URLSearchParams(location.search), sid=p.get('s'), pinned=p.get('k');
const enc=new TextEncoder(), b64=u=>{let s='';for(const x of u)s+=String.fromCharCode(x);return btoa(s).replaceAll('+','-').replaceAll('/','_').replaceAll('=','')};
let chosen=[];$('files').onchange=e=>{chosen=[...e.target.files];$('send').disabled=chosen.length<3;$('status').textContent=chosen.map(f=>f.name).join(', ')};
async function go(){try{
 if(!sid||!pinned)throw Error('Invalid or incomplete QR link.');
 const names=new Set(chosen.map(f=>f.name));if(!names.has('identity.json')||!names.has('pairing.json')||!names.has('sdk_token'))throw Error('Select all three official pairing files.');
 const cfg=await (await fetch('/pair/config?s='+encodeURIComponent(sid))).json();if(cfg.sid!==sid||cfg.pub!==pinned)throw Error('Vita key does not match this QR.');
 const raw=pinned.replaceAll('-','+').replaceAll('_','/');const vitaBytes=Uint8Array.from(atob(raw+'='.repeat((4-raw.length%4)%4)),c=>c.charCodeAt(0));
 const vita=await crypto.subtle.importKey('raw',vitaBytes,{name:'ECDH',namedCurve:'P-256'},false,[]);
 const eph=await crypto.subtle.generateKey({name:'ECDH',namedCurve:'P-256'},true,['deriveBits']);
 const bits=await crypto.subtle.deriveBits({name:'ECDH',public:vita},eph.privateKey,256);
 const key=await crypto.subtle.importKey('raw',bits,'HKDF',false,['deriveKey']);
 const aes=await crypto.subtle.deriveKey({name:'HKDF',hash:'SHA-256',salt:enc.encode(sid),info:enc.encode('MuseVita pairing transfer v1')},key,{name:'AES-GCM',length:256},false,['encrypt']);
 const obj={};for(const f of chosen)obj[f.name==='sdk_token'?'sdk_token':f.name.slice(0,-5)]=await f.text();
 const iv=crypto.getRandomValues(new Uint8Array(12));const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv,additionalData:enc.encode(sid)},aes,enc.encode(JSON.stringify(obj))));
 const epk=await crypto.subtle.exportKey('raw',eph.publicKey);const body={sid,epk:b64(new Uint8Array(epk)),iv:b64(iv),ct:b64(ct)};
 const res=await fetch('/pair/upload?s='+encodeURIComponent(sid),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!res.ok)throw Error(await res.text());$('status').textContent='Encrypted bundle sent. Return to the Vita and press SELECT.';$('send').disabled=true;
 }catch(e){$('status').textContent=e.message}}
$('send').onclick=go;
</script>
